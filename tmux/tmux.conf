# This is the source of truth - setup-env.sh symlinks ~/.tmux.conf to
# this file, it no longer generates it. Edit this file directly; your
# changes take effect next time tmux reloads its config
# (prefix + r, or `tmux source-file ~/.tmux.conf`).

# Core window handling - prefix stays at the factory default (Ctrl+b)
# on purpose, to avoid colliding with LazyVim's Ctrl+h/j/k/l nav keys.
set -g prefix C-b
bind C-b send-prefix

# Quality of life tweaks
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Terminal type and truecolor; make copy-mode selection visible
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g mode-style "reverse"

# Pass modified keys (Shift+Enter) and terminal escapes through to TUIs such
# as Claude Code; extended-keys needs tmux 3.2+, allow-passthrough 3.3+ (-q
# keeps older hosts quiet)
set -gq allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Plugin ecosystem
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'

# Strategy flags for LazyVim editing workspaces
set -g @persist-strategy-nvim 'session'
set -g @persist-capture-pane-contents 'on'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
